<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="How it works: 1 sign up with account_register, 2 log in with stored credentials, 3 save the session, 4 restore it in a new worker process, 5 clean up the account and inbox." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>How it works: 1 sign up with account_register, 2 log in with stored credentials, 3 save the session, 4 restore it in a new worker process, 5 clean up the account and inbox.</title>
<rect x="1" y="1" width="1198" height="318" rx="22" fill="#F7F6F2" stroke="#C3C7CD" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="184" y1="128" x2="1016" y2="128" stroke="#C3C7CD" stroke-width="2" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.4s" repeatCount="indefinite"/></line>
<circle r="7" fill="#22C9A0" cx="140" cy="128"><animate attributeName="cx" dur="7.5s" repeatCount="indefinite" values="140;1060;1060" keyTimes="0;0.9;1" calcMode="linear"/><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.04;0.86;0.9;1" values="0;1;1;0;0"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.15s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/><g transform="translate(140 128)">
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#DADCDF" stroke-width="1.5"/><circle cx="0" cy="0" r="44" fill="none" stroke="#22C9A0" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.02;0.2;0.24;1" values="0;1;1;0;0"/></circle>
      <g><rect x="-11" y="-13" width="22" height="26" rx="4" fill="none" stroke="#0B0F14" stroke-width="2.4"/><line x1="-5" y1="-4" x2="5" y2="-4" stroke="#0B0F14" stroke-width="2.4" stroke-linecap="round"/><line x1="-5" y1="3" x2="5" y2="3" stroke="#0B0F14" stroke-width="2.4" stroke-linecap="round"/></g>
      <text x="0" y="78" font-size="19" font-weight="700" text-anchor="middle" fill="#0B0F14">1 · Sign up</text>
      <text x="0" y="102" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6B7380">account_register</text>
    </g></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.27s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.27s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/><g transform="translate(370 128)">
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#DADCDF" stroke-width="1.5"/><circle cx="0" cy="0" r="44" fill="none" stroke="#22C9A0" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.4;0.44;1" values="0;0;1;1;0;0"/></circle>
      <g><rect x="-11" y="-3" width="22" height="16" rx="4" fill="none" stroke="#0B0F14" stroke-width="2.4"/><path d="M-6 -3 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#0B0F14" stroke-width="2.4"/></g>
      <text x="0" y="78" font-size="19" font-weight="700" text-anchor="middle" fill="#0B0F14">2 · Log in</text>
      <text x="0" y="102" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6B7380">browser_fill · secret</text>
    </g></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.39s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.39s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/><g transform="translate(600 128)">
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#DADCDF" stroke-width="1.5"/><circle cx="0" cy="0" r="44" fill="none" stroke="#22C9A0" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.6;0.64;1" values="0;0;1;1;0;0"/></circle>
      <g><ellipse cx="0" cy="-8" rx="11" ry="4.5" fill="none" stroke="#0B0F14" stroke-width="2.4"/><path d="M-11 -8 v16 a11 4.5 0 0 0 22 0 v-16" fill="none" stroke="#0B0F14" stroke-width="2.4"/></g>
      <text x="0" y="78" font-size="19" font-weight="700" text-anchor="middle" fill="#0B0F14">3 · Save state</text>
      <text x="0" y="102" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6B7380">session_save_state</text>
    </g></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.51s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.51s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/><g transform="translate(830 128)">
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#DADCDF" stroke-width="1.5"/><circle cx="0" cy="0" r="44" fill="none" stroke="#22C9A0" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.6;0.62;0.8;0.84;1" values="0;0;1;1;0;0"/></circle>
      <g><path d="M-10 2 a10 10 0 1 0 3 -9" fill="none" stroke="#0B0F14" stroke-width="2.4" stroke-linecap="round"/><path d="M-9 -12 l2 6 l6 -2" fill="none" stroke="#0B0F14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="0" y="78" font-size="19" font-weight="700" text-anchor="middle" fill="#0B0F14">4 · Restore</text>
      <text x="0" y="102" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6B7380">session_start</text>
    </g></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.63s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.63s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/><g transform="translate(1060 128)">
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#DADCDF" stroke-width="1.5"/><circle cx="0" cy="0" r="44" fill="none" stroke="#22C9A0" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.8;0.82;1" values="0;0;1;1"/></circle>
      <g><path d="M-9 -7 h18 M-5 -7 v-4 h10 v4 M-7 -7 l1.5 18 h11 l1.5 -18" fill="none" stroke="#0B0F14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="0" y="78" font-size="19" font-weight="700" text-anchor="middle" fill="#0B0F14">5 · Clean up</text>
      <text x="0" y="102" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6B7380">account_delete</text>
    </g></g>
<line x1="715" y1="40" x2="715" y2="236" stroke="#C3C7CD" stroke-width="1.5" stroke-dasharray="3 5"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/><path d="M80 262 v10 h580 v-10" fill="none" stroke="#6B7380" stroke-width="1.6"/><text x="370" y="298" font-size="13" font-weight="700" letter-spacing="1.4" text-anchor="middle" fill="#6B7380">WORKER 1</text><path d="M770 262 v10 h350 v-10" fill="none" stroke="#0F8F72" stroke-width="1.6"/><text x="945" y="298" font-size="13" font-weight="700" letter-spacing="1.4" text-anchor="middle" fill="#0F8F72">WORKER 2 · NEW PROCESS, SAVED COOKIES</text></g>
</svg>
