<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-label="Session restore, illustrated: worker 1 saves 2 cookies into the encrypted vault and closes; a new worker 2 starts with them and is logged in as Alex Demo with zero credential fills." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
